# Prefix is Ctrl+Space so it does not steal Ctrl-b or shell Ctrl-a.
# Detach is prefix then d. Ctrl-d stays EOF and is not rebound.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -s escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g aggressive-resize on
set -g detach-on-destroy off

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"
set -s set-clipboard on

set -g mode-keys vi
set -g status-keys emacs

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g status-style "bg=#15141b,fg=#6d6d6d"
set -g status-left "#[fg=#15141b,bg=#a277ff,bold] #S "
set -g status-right "#[fg=#6d6d6d] %Y-%m-%d #[fg=#61ffca]%H:%M "
set -g window-status-current-style "fg=#61ffca,bg=#29263c,bold"
set -g window-status-style "fg=#6d6d6d"
set -g pane-border-style "fg=#29263c"
set -g pane-active-border-style "fg=#a277ff"
set -g message-style "bg=#29263c,fg=#edecee"
set -g mode-style "bg=#29263c,fg=#edecee"
